];
const REPORTS = [
  '안심콜테스트','17층 63빌딩 52층 승강기 갇힘','압구정성인압구정성당 2층','남산타운, 부친 낙상, 의식호흡유지','청와대 화재'
];
const ROWS = Array.from({length:22},(_,i)=>{
  const c = CATS[i%3];
  const dt = `2025-12-${String(8 + (i%13)).padStart(2,'0')} ${String(9+(i%12)).padStart(2,'0')}:${String((i*7)%60).padStart(2,'0')}:${String((i*11)%60).padStart(2,'0')}`;
  return {
    no:'ZQ113'+(5729433+i),
    time: dt,
    op:'접수대 17',
    cat:c,
    addr:ADDRS[i%ADDRS.length],
    desc:REPORTS[i%REPORTS.length],
    phone:'010-0000-0000',
    historyCount: (i%3===2 && i!==6) ? 0 : ((i%4)+1) // some have 0
  };
});
// guarantee at least one with 0 visible early
ROWS[6].historyCount = 0;

/* ───── render rows ───── */
const $rows = document.getElementById('rows');
$rows.innerHTML = ROWS.map((r,i)=>`
  <tr>
    <td class="mono">${r.no}</td>
    <td class="mono">${r.time}</td>
    <td>${r.op}</td>
    <td><span class="badge ${r.cat.k}">${r.cat.label}</span></td>
    <td>${r.addr}</td>
    <td>${r.desc}</td>
    <td class="mono">${r.phone}</td>
    <td style="text-align:center">
      <button class="icon-btn" onclick="openHistory(${i})" title="생성 이력">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h2"/></svg>
        ${r.historyCount>0?`<span class="dot">${r.historyCount}</span>`:''}
      </button>
    </td>
    <td style="text-align:center">
      <button class="btn btn-outline btn-sm" onclick="openGenerate(${i})">생성</button>
    </td>
  </tr>
`).join('');

/* ───── modals ───── */
const genScrim = document.getElementById('genScrim');
const histScrim = document.getElementById('histScrim');
const genBody = document.getElementById('genBody');
const genFoot = document.getElementById('genFoot');
let genState = 'idle'; // idle | loading | done
let currentRow = null;
let timer = null;

function openGenerate(i){
  currentRow = ROWS[i];
  setGenState('idle');
  genScrim.classList.add('show');
}
function setGenState(s){
  genState = s;
  const r = currentRow;
  if(s==='idle'){
    genBody.innerHTML = `
      <div class="section-label">신고 정보</div>
      <div class="info-card">
        <div class="info-row"><span class="k">재해번호</span><span class="v mono">${r.no}</span></div>
        <div class="info-row"><span class="k">재난 종류</span><span class="v"><span class="badge ${r.cat.k}">${r.cat.label}</span></span></div>
        <div class="info-row"><span class="k">주소</span><span class="v">${r.addr}</span></div>
      </div>
      <div class="form-row">
        <div class="select" style="height:44px"><select><option>별지 서식(기본)</option><option>요약 서식</option><option>상세 서식</option></select></div>
      </div>
      <div class="form-row">
        <input class="form-input" value="${r.desc} (1차).hwpx" />
      </div>
      <div class="form-help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        동일한 파일명으로 생성 시, 파일명 뒤에 차수(2차, 3차)가 자동으로 추가됩니다.
      </div>`;
    genFoot.innerHTML = `
      <button class="btn btn-outline" data-close>취소</button>
      <button class="btn btn-primary" onclick="setGenState('loading')">생성</button>`;
    bindClose();
  }
  if(s==='loading'){
    genBody.innerHTML = `
      <div class="section-label">신고 정보</div>
      <div class="info-card">
        <div class="info-row"><span class="k">재해번호</span><span class="v mono">${r.no}</span></div>
        <div class="info-row"><span class="k">재난 종류</span><span class="v"><span class="badge ${r.cat.k}">${r.cat.label}</span></span></div>
        <div class="info-row"><span class="k">주소</span><span class="v">${r.addr}</span></div>
      </div>
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div class="loading-txt">보고서 생성 중...</div>
      </div>`;
    genFoot.innerHTML = `
      <button class="btn btn-outline" disabled style="opacity:.5">취소</button>
      <button class="btn btn-primary" disabled>생성중</button>`;
    clearTimeout(timer);
    timer = setTimeout(()=>setGenState('done'), 2200);
  }
  if(s==='done'){
    genBody.innerHTML = `
      <div class="section-label">신고 정보</div>
      <div class="info-card">
        <div class="info-row"><span class="k">재해번호</span><span class="v mono">${r.no}</span></div>
        <div class="info-row"><span class="k">재난 종류</span><span class="v"><span class="badge ${r.cat.k}">${r.cat.label}</span></span></div>
        <div class="info-row"><span class="k">주소</span><span class="v">${r.addr}</span></div>
      </div>
      <div class="form-row">
        <input class="form-input" readonly value="${r.desc} (1차).hwpx" />
      </div>
      <div class="complete-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
        보고서 생성이 완료되었습니다.
      </div>`;
    genFoot.innerHTML = `
      <button class="btn btn-outline" data-close>닫기</button>
      <button class="btn btn-primary" onclick="downloadReport()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        보고서 다운로드
      </button>`;
    bindClose();
    // bump history for that row
    currentRow.historyCount = (currentRow.historyCount||0)+1;
    renderRowDot();
  }
}
function downloadReport(){
  const blob = new Blob([`보고서: ${currentRow.no}\n재난: ${currentRow.cat.label}\n주소: ${currentRow.addr}\n신고: ${currentRow.desc}\n생성: ${new Date().toLocaleString('ko-KR')}`], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${currentRow.desc} (1차).txt`;
  a.click();
}
function renderRowDot(){
  // re-render rows lightly
  const idx = ROWS.indexOf(currentRow);
  const tr = $rows.children[idx];
  if(!tr) return;
  const cell = tr.children[7];
  cell.innerHTML = `
    <button class="icon-btn" onclick="openHistory(${idx})" title="생성 이력">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6M9 9h2"/></svg>
      ${currentRow.historyCount>0?`<span class="dot">${currentRow.historyCount}</span>`:''}
    </button>`;
}

/* ───── history modal ───── */
function openHistory(i){
  const r = ROWS[i];
  currentRow = r;
  document.getElementById('hi-no').textContent = r.no;
  document.getElementById('hi-cat').innerHTML = `<span class="badge ${r.cat.k}">${r.cat.label}</span>`;
  document.getElementById('hi-time').textContent = r.time;
  document.getElementById('hi-addr').textContent = r.addr;
  const body = document.getElementById('histBody');
  if(r.historyCount===0){
    body.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
        생성된 보고서가 없습니다
      </div>`;
  } else {
    const rows = Array.from({length:r.historyCount},(_,k)=>`
      <tr>
        <td>${k+1}차</td>
        <td>별지 서식(기본)</td>
        <td class="mono">2025-12-${String(8+k).padStart(2,'0')} 09:00:11</td>
        <td>03.17(월) 중구 필동 1가 화재 (${k+1}차).hwpx</td>
        <td>홍길동</td>
        <td style="text-align:center">
          <button class="dl" title="다운로드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
        </td>
      </tr>`).join('');
    body.innerHTML = `
      <table class="htable">
        <thead><tr><th style="width:60px">차수</th><th style="width:140px">서식</th><th style="width:170px">생성일시</th><th>파일명</th><th style="width:90px">생성자</th><th style="width:80px;text-align:center">다운로드</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }
  histScrim.classList.add('show');
}

/* ───── close handlers ───── */
function bindClose(){
  document.querySelectorAll('[data-close]').forEach(el=>{
    el.onclick = ()=>{
      genScrim.classList.remove('show');
      histScrim.classList.remove('show');
      clearTimeout(timer);
    };
  });
}
bindClose();
[genScrim,histScrim].forEach(s=>s.addEventListener('click',e=>{ if(e.target===s){ s.classList.remove('show'); clearTimeout(timer); }}));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ genScrim.classList.remove('show'); histScrim.classList.remove('show'); clearTimeout(timer); }});

/* ───── live clock ───── */
setInterval(()=>{
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  document.getElementById('now').textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} / ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
},1000);
</script>
</body>
</html>
