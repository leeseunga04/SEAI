<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SOP 체크리스트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --blue: #1A6CF6;
    --blue-light: #EBF1FF;
    --red: #FF4444;
    --gray-bg: #F2F2F7;
    --gray-border: #E5E5EA;
    --gray-text: #8E8E93;
    --text: #1C1C1E;
    --white: #FFFFFF;
  }
  body {
    background: #E8E8ED;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }
  .phone {
    width: 390px;
    height: 844px;
    background: var(--gray-bg);
    border-radius: 54px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 80px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.3);
  }
  .screen { width: 100%; height: 100%; overflow: hidden; position: relative; }

  /* STATUS BAR */
  .status-bar {
    height: 54px;
    background: var(--white);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 10px;
    font-size: 15px;
    font-weight: 600;
  }
  .status-bar .time { font-size: 15px; font-weight: 700; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons svg { width: 16px; height: 12px; }

  /* HEADER */
  .header {
    background: var(--white);
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--gray-border);
    position: relative;
    flex-shrink: 0;
  }
  .header .back {
    position: absolute; left: 16px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 50%;
    transition: background .15s;
  }
  .header .back:active { background: var(--gray-bg); }
  .header h1 { font-size: 17px; font-weight: 600; color: var(--text); }

  /* PAGE WRAPPER */
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    background: var(--gray-bg);
    transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
  }
  .page.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }

  /* SCROLL AREA */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* SELECT PAGE */
  .section-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    padding: 4px 0 8px;
  }
  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .role-card {
    background: var(--white);
    border-radius: 16px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    transition: transform .12s, box-shadow .12s;
    user-select: none;
  }
  .role-card:active { transform: scale(.96); box-shadow: 0 1px 2px rgba(0,0,0,.04); }

  /* CHECKLIST PAGE */
  .filter-bar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-border);
    padding: 10px 0 10px 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    position: relative;
    z-index: 5;
  }
  .chip-scroll {
    flex: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    align-items: center;
    padding-right: 8px;
  }
  .chip-scroll::-webkit-scrollbar { display: none; }
  .chip-expand-wrap {
    flex-shrink: 0;
    padding: 0 12px 0 4px;
    display: flex;
    align-items: center;
    background: linear-gradient(to right, transparent, var(--white) 30%);
    position: relative;
  }
  .chip {
    flex-shrink: 0;
    height: 34px;
    padding: 0 14px;
    border-radius: 17px;
    border: 1.5px solid var(--gray-border);
    background: var(--white);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center;
    transition: all .15s;
    white-space: nowrap;
  }
  .chip.active {
    border-color: var(--blue);
    color: var(--blue);
    background: var(--blue-light);
  }
  .chip-expand {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 17px;
    border: 1.5px solid var(--gray-border);
    background: var(--white);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .15s;
  }
  .chip-expand:active { background: var(--gray-bg); }

  /* EXPAND DROPDOWN */
  .expand-dropdown {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: var(--white);
    z-index: 25;
    border-bottom: 1px solid var(--gray-border);
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    transition: transform .22s cubic-bezier(.4,0,.2,1), opacity .22s;
    transform-origin: top;
  }
  .expand-dropdown.hidden { transform: scaleY(0); opacity: 0; pointer-events: none; }
  .expand-chips {
    padding: 12px 16px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .dim {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.35);
    z-index: 15;
    transition: opacity .22s;
  }
  .dim.hidden { opacity: 0; pointer-events: none; }

  /* CHECKLIST CONTENT */
  .checklist-header {
    background: var(--white);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .checklist-header .role-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .checklist-header .sub {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--gray-text);
  }
  .badge {
    background: var(--red);
    color: var(--white);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 8px;
  }
  .checklist-card {
    background: var(--white);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--gray-border);
    transition: background .1s;
    user-select: none;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item:active { background: var(--gray-bg); }
  .check-icon {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--gray-border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .2s;
  }
  .check-icon.checked {
    background: var(--blue);
    border-color: var(--blue);
  }
  .check-icon svg { display: none; }
  .check-icon.checked svg { display: block; }
  .check-label {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
    line-height: 1.4;
  }
  .count-row {
    padding: 12px;
    text-align: center;
    font-size: 14px;
    color: var(--gray-text);
    font-weight: 500;
    border-top: 1px solid var(--gray-border);
  }
  .reset-btn {
    background: var(--white);
    border-radius: 16px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    transition: background .12s;
    user-select: none;
  }
  .reset-btn:active { background: var(--gray-bg); }
  .notice {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    font-size: 12px;
    color: var(--gray-text);
    line-height: 1.5;
    padding: 4px 0 16px;
  }
  .notice .icon { flex-shrink: 0; margin-top: 1px; }

  /* HOME INDICATOR */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(0,0,0,.25);
    border-radius: 3px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">

    <!-- PAGE 1: ROLE SELECT -->
    <div class="page" id="page-select">
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1C1C1E"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1C1C1E"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#1C1C1E"/><rect x="13.5" y="0.5" width="3" height="11.5" rx="1" fill="#1C1C1E" opacity=".3"/></svg>
          <svg viewBox="0 0 16 12" fill="none"><path d="M8 2.5C9.9 2.5 11.6 3.3 12.8 4.6L14.2 3.1C12.6 1.4 10.4 0.5 8 0.5C5.6 0.5 3.4 1.4 1.8 3.1L3.2 4.6C4.4 3.3 6.1 2.5 8 2.5Z" fill="#1C1C1E"/><path d="M8 5.5C9.2 5.5 10.3 6 11.1 6.8L12.5 5.3C11.3 4.2 9.7 3.5 8 3.5C6.3 3.5 4.7 4.2 3.5 5.3L4.9 6.8C5.7 6 6.8 5.5 8 5.5Z" fill="#1C1C1E"/><circle cx="8" cy="10" r="1.5" fill="#1C1C1E"/></svg>
          <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1C1C1E" stroke-opacity=".35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#1C1C1E"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.5 24.5 6C24.5 5.5 23.8 4.8 23 4.5Z" fill="#1C1C1E" opacity=".4"/></svg>
        </div>
      </div>
      <div class="header">
        <div class="back" onclick="goBack()">
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1.5 8.5L9 16" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h1>SOP 체크리스트</h1>
      </div>
      <div class="scroll-area">
        <div class="section-label">담당 업무 선택</div>
        <div class="card-grid" id="role-grid"></div>
      </div>
      <div class="home-indicator"></div>
    </div>

    <!-- PAGE 2: CHECKLIST -->
    <div class="page hidden" id="page-checklist">
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1C1C1E"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1C1C1E"/><rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#1C1C1E"/><rect x="13.5" y="0.5" width="3" height="11.5" rx="1" fill="#1C1C1E" opacity=".3"/></svg>
          <svg viewBox="0 0 16 12" fill="none"><path d="M8 2.5C9.9 2.5 11.6 3.3 12.8 4.6L14.2 3.1C12.6 1.4 10.4 0.5 8 0.5C5.6 0.5 3.4 1.4 1.8 3.1L3.2 4.6C4.4 3.3 6.1 2.5 8 2.5Z" fill="#1C1C1E"/><path d="M8 5.5C9.2 5.5 10.3 6 11.1 6.8L12.5 5.3C11.3 4.2 9.7 3.5 8 3.5C6.3 3.5 4.7 4.2 3.5 5.3L4.9 6.8C5.7 6 6.8 5.5 8 5.5Z" fill="#1C1C1E"/><circle cx="8" cy="10" r="1.5" fill="#1C1C1E"/></svg>
          <svg viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#1C1C1E" stroke-opacity=".35"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#1C1C1E"/><path d="M23 4.5V7.5C23.8 7.2 24.5 6.5 24.5 6C24.5 5.5 23.8 4.8 23 4.5Z" fill="#1C1C1E" opacity=".4"/></svg>
        </div>
      </div>
      <div class="header">
        <div class="back" onclick="goBack()">
          <svg width="10" height="17" viewBox="0 0 10 17" fill="none"><path d="M9 1L1.5 8.5L9 16" stroke="#1C1C1E" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h1>SOP 체크리스트</h1>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar" id="filter-bar">
        <div class="chip-scroll" id="chip-row"></div>
        <div class="chip-expand-wrap">
          <div class="chip-expand" id="expand-btn" onclick="toggleExpand()">
            <svg id="chevron-icon" width="12" height="8" viewBox="0 0 12 8" fill="none"><path d="M1 1L6 6L11 1" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
        </div>
        <!-- EXPAND DROPDOWN -->
        <div class="expand-dropdown hidden" id="expand-overlay">
          <div class="expand-chips" id="expand-chips"></div>
        </div>
      </div>
      <!-- DIM -->
      <div class="dim hidden" id="dim" onclick="toggleExpand()"></div>

      <div class="scroll-area" id="checklist-scroll">
        <div class="checklist-header" id="checklist-header"></div>
        <div class="checklist-card">
          <div id="checklist-items"></div>
          <div class="count-row" id="count-row">0 / 0</div>
        </div>
        <div class="reset-btn" onclick="resetChecks()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15.5 3C13.8 1.3 11.5 0.5 9 0.5C4.3 0.5 0.5 4.3 0.5 9C0.5 13.7 4.3 17.5 9 17.5C12.9 17.5 16.2 15 17.2 11.5" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 3V7H11.5" stroke="#1C1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          초기화
        </div>

          <span class="icon">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6.5" stroke="#8E8E93"/><path d="M7 6V10" stroke="#8E8E93" stroke-width="1.2" stroke-linecap="round"/><circle cx="7" cy="4" r="0.8" fill="#8E8E93"/></svg>
          </span>
          <span>본 체크리스트는 출동 업무 지원을 위한 SOP 기반 보조자료입니다. 별도 저장되지 않으며, 공식 증빙자료로 활용할 수 없습니다.</span>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>

  </div>
</div>

<script>
const DATA = {
  지휘관: { subtitle:'일반화재(주택)', badge:'화재', items:['상황 접수 및 재난 종분류 확인','지휘소 위치 선정 및 통보','진입 구역 및 방어선 설정','추가 자원 요청 여부 판단','대원 이탈 여부 수시 확인','철수 기준 설정'] },
  현장대응단: { subtitle:'일반화재(주택)', badge:'화재', items:['현장 도착 보고 및 상황 파악','진압 구역 배치 확인','호스 연장 및 관창 위치 선정','연소 확대 방지 작업','잔불 처리 및 현장 안전 확보','대원 안전 여부 확인'] },
  화재조사관: { subtitle:'일반화재(주택)', badge:'화재', items:['발화 지점 파악','연소 형태 및 방향 확인','사상자 현황 확인','목격자 및 관계인 확보','증거물 보전 조치','화재 원인 초동 분석'] },
  통신담당: { subtitle:'일반화재(주택)', badge:'화재', items:['출동 지령 수신 및 확인','관련 기관 연락 체계 구축','현장 지휘소 무선 연결','통신 장비 점검','지원 요청 중계','상황실 보고 및 기록'] },
  구조담당: { subtitle:'일반화재(주택)', badge:'구조', items:['요구조자 위치 파악','진입 경로 확보','구조 장비 점검 및 준비','구조 작업 수행','부상자 응급 처치 연계','구조 완료 보고'] },
  구급담당: { subtitle:'일반화재(주택)', badge:'구급', items:['환자 분류(트리아지) 실시','응급 처치 우선순위 결정','의료기관 이송 준비','현장 의료 지원 조정','약품 및 장비 관리','구급 기록 작성'] },
  안전담당: { subtitle:'일반화재(주택)', badge:'안전', items:['현장 위험 요소 파악','안전 구역 설정','대원 보호 장비 점검','위험 상황 경보 발령','안전 수칙 준수 확인','사고 발생 시 즉시 보고'] },
  장비담당: { subtitle:'일반화재(주택)', badge:'장비', items:['출동 장비 점검','소방차 작동 상태 확인','특수 장비 배치','장비 고장 시 대체 조치','현장 복귀 후 장비 정비','장비 소모품 보충'] },
  상황관리: { subtitle:'일반화재(주택)', badge:'관리', items:['상황 접수 및 분류','출동 인력 편성','현장 진행 상황 모니터링','유관 기관 협조 요청','상황 종료 선언','결과 보고서 작성'] },
  현장지휘: { subtitle:'일반화재(주택)', badge:'지휘', items:['현장 지휘권 확인','전술 계획 수립','부대 배치 지시','작전 변경 시 즉시 통보','지휘 인수인계 관리','현장 지휘 일지 작성'] }
};

const ROLES = Object.keys(DATA);
const ALL_ROLES = ROLES;

let currentRole = ROLES[0];
let checks = {};
let expandOpen = false;

function init() {
  const grid = document.getElementById('role-grid');
  ALL_ROLES.forEach(role => {
    const card = document.createElement('div');
    card.className = 'role-card';
    card.textContent = role;
    card.onclick = () => goToChecklist(role);
    grid.appendChild(card);
  });
  ROLES.forEach(r => checks[r] = new Array(DATA[r].items.length).fill(false));
}

function goToChecklist(role) {
  currentRole = role;
  renderChecklist();
  document.getElementById('page-select').classList.add('hidden');
  document.getElementById('page-checklist').classList.remove('hidden');
}

function goBack() {
  document.getElementById('page-checklist').classList.add('hidden');
  document.getElementById('page-select').classList.remove('hidden');
  if (expandOpen) toggleExpand();
}

function renderChecklist() {
  renderChips();
  renderExpandChips();
  renderHeader();
  renderItems();
  updateCount();
}

function renderChips() {
  const row = document.getElementById('chip-row');
  row.innerHTML = '';
  ROLES.forEach(role => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (role === currentRole ? ' active' : '');
    chip.textContent = role;
    chip.onclick = () => selectRole(role);
    row.appendChild(chip);
  });
}

function renderExpandChips() {
  const area = document.getElementById('expand-chips');
  area.innerHTML = '';
  ROLES.forEach(role => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (role === currentRole ? ' active' : '');
    chip.textContent = role;
    chip.onclick = () => { selectRole(role); toggleExpand(); };
    area.appendChild(chip);
  });
}

function renderHeader() {
  const d = DATA[currentRole];
  document.getElementById('checklist-header').innerHTML =
    `<div class="role-title">${currentRole}</div>
     <div class="sub">${d.subtitle} <span class="badge">${d.badge}</span></div>`;
}

function renderItems() {
  const container = document.getElementById('checklist-items');
  container.innerHTML = '';
  DATA[currentRole].items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'check-item';
    row.innerHTML = `
      <div class="check-icon${checks[currentRole][i] ? ' checked' : ''}">
        <svg width="12" height="9" viewBox="0 0 12 9" fill="none"><path d="M1.5 4.5L4.5 7.5L10.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="check-label">${item}</span>`;
    row.onclick = () => toggleCheck(i);
    container.appendChild(row);
  });
}

function toggleCheck(i) {
  checks[currentRole][i] = !checks[currentRole][i];
  const items = document.querySelectorAll('.check-item');
  const icon = items[i].querySelector('.check-icon');
  icon.classList.toggle('checked', checks[currentRole][i]);
  updateCount();
}

function updateCount() {
  const total = DATA[currentRole].items.length;
  const done = checks[currentRole].filter(Boolean).length;
  document.getElementById('count-row').textContent = `${done} / ${total}`;
}

function resetChecks() {
  checks[currentRole] = new Array(DATA[currentRole].items.length).fill(false);
  renderItems();
  updateCount();
}

function selectRole(role) {
  currentRole = role;
  renderChips();
  renderExpandChips();
  renderHeader();
  renderItems();
  updateCount();
}

function toggleExpand() {
  expandOpen = !expandOpen;
  const overlay = document.getElementById('expand-overlay');
  const dim = document.getElementById('dim');
  const path = document.querySelector('#chevron-icon path');
  overlay.classList.toggle('hidden', !expandOpen);
  dim.classList.toggle('hidden', !expandOpen);
  path.setAttribute('d', expandOpen ? 'M1 7L6 2L11 7' : 'M1 1L6 6L11 1');
  if (expandOpen) {
    overlay.addEventListener('transitionend', function handler() {
      const rect = overlay.getBoundingClientRect();
      const phoneRect = overlay.closest('.screen').getBoundingClientRect();
      dim.style.top = (rect.bottom - phoneRect.top) + 'px';
      overlay.removeEventListener('transitionend', handler);
    });
  }
}

init();
</script>
</body>
</html>
